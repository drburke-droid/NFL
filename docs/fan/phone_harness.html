<!doctype html>
<html><head><meta charset="utf-8"><title>phone harness (dev): fan.html in phone-sized frames</title>
<style>body{margin:0;background:#222;display:flex;gap:20px;padding:10px}iframe{border:0;background:#000;box-shadow:0 0 0 8px #111,0 0 0 10px #444;border-radius:18px}</style></head>
<body>
<iframe id="p" width="430" height="860"></iframe>
<iframe id="q" width="390" height="700"></iframe>
<script>for (const id of ["p", "q"]) document.getElementById(id).src = "../fan.html?v=" + Date.now() + id;</script>
</body></html>
