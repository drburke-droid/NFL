name: ESPN diagnostic

# One-off: can a runner reach ESPN at all, and does any header profile or host get through?
# Separate workflow, own concurrency group, no schedule — it can never queue against a send.

on:
  workflow_dispatch:

concurrency:
  group: espn-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/espn_diag.py
