name: SaberSim send

# Unattended slate sends. Fires every 5 min during NFL game windows (UTC), and each tick
# decides in ~20 s (stdlib only) whether the next slate kicks off 78-82 min from now and has
# not been sent. Only then does it install deps, fetch the private Model_Burke package, run the
# generator, and email the CSV. Nothing about the projections is committed or uploaded; the
# only write-back is data/sabersim/sent_log.json (slate key, time, row count).
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   ODDS_API_KEY        one Odds API key (the free /events endpoint + the DK props pulls)
#   SMTP_USER           your Gmail address
#   SMTP_PASS           a Gmail App Password (Google Account -> Security -> 2-Step -> App passwords)
#   MAIL_CC             optional, your own address to keep a copy
#   MODEL_BURKE_REPO    e.g. drburke-droid/model-burke-private  (private repo holding pkg/model_burke/)
#   MODEL_BURKE_TOKEN   fine-grained PAT with Contents: READ AND WRITE on that private repo (write lets the
#                       run push each CSV to sends/ there, which the Pages "Run now" page downloads)
# Variables (Settings -> Secrets and variables -> Actions -> Variables tab):
#   MAIL_TO             recipient. Since 2026-09-24 the sends go to the owner only (the repo variable
#                       and the default below); SaberSim's analysts address is no longer used.
#   SEND_WINDOW         optional, default "58,62" — a single attempt at T-60 (since 2026-09-27; the sends go to the
#                       owner only, so SaberSim's T-75 cutoff no longer applies, and T-60 is after the feeds carry the
#                       inactives, ~T-73 measured). The graders count a send generated by T-55 (scripts/send_rules.py).
#                       The history below is why it was T-80 before. Inactives are RELEASED at T-90 but
#                       feeds need several minutes to carry them: on 2026-09-13 the T-90 tick emailed at
#                       T-87.6 with 8 OUT, and the T-68 rerun had 21 — 13 inactives missed, Alvin Kamara
#                       among them at a 7.5-point projection. Kickoffs are always on a 5-minute mark, so
#                       the ticks land at T-90/T-85/T-80/T-75, so T-80 is the LAST start that still lands
#                       inside the T-75 cutoff (2.5 min of run time puts the email at ~T-77.5). T-75 was
#                       dropped as a fallback on 2026-09-14: it emails at ~T-72.5, already late, and could
#                       arrive just as the send is being forced by hand, putting two files in front of
#                       SaberSim. One automatic attempt; the Pages "Run now" button is the fallback.
#                       Measured on 2026-09-13: the feeds do not carry the inactives until ~T-73, so this
#                       send reads the injury report, not the inactives. Widening the window does not fix
#                       that — see scripts/inactives_probe.py, which is measuring the real crossover.
#
# Manual send from the Actions tab (or the GitHub mobile app): Run workflow -> force=true.

on:
  push:                      # any push to main runs the window check too (a fallback trigger the
    branches: [main]         # scheduler can't skip; outside the window it exits in ~20 s)
  schedule:
    # GitHub's scheduler never fired for this workflow on 2026-09-10 (neither a restricted nor a plain cron).
    # The live trigger is an external cron (cron-job.org) POSTing to the workflow_dispatch endpoint every
    # 5 minutes; this schedule is left in as a free second chance. Every trigger runs the same window check.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force: { description: "Send now regardless of window / sent log", default: "false" }
      slate: { description: "Kickoff key of a specific slate, e.g. 2026-09-20T20:25 (blank = the earliest unsent)", default: "" }
      dry_run: { description: "Run everything but the email", default: "false" }

permissions:
  contents: write

concurrency:
  group: sabersim-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check send window (stdlib only)
        id: win
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEND_WINDOW: ${{ vars.SEND_WINDOW || '58,62' }}
          SLATE_REQ: ${{ inputs.slate }}
        run: python scripts/sabersim_auto.py --check ${SLATE_REQ:+--slate "$SLATE_REQ"}

      # Records how many players ESPN lists as OUT, every tick inside T-100..T-60, so the gap
      # between the T-90 release and the feeds actually carrying it is measured rather than
      # inferred from the two hand-scraped points we have. continue-on-error and a bare-stdlib
      # script: this step cannot fail the job, and it writes nothing to the repo, because a commit
      # to main would trigger this very workflow and queue against the send.
      - name: Probe the inactives feeds (never affects the send)
        # Samples the IMMINENT slate, whether or not it has been sent. Keying it to the slate the
        # workflow is acting on was wrong: that jumps to the next unsent slate the moment a send
        # completes, so on 2026-09-14 the MNF samples stopped at T-85 and the post-send half of the
        # curve — the half that shows whether the feeds moved after T-80 — was never taken.
        # Still skipped on the tick that actually sends, so it cannot add a second ahead of
        # generation; that sample is redundant anyway, the send's own CSV records it.
        if: steps.win.outputs.in_window != 'true'
        continue-on-error: true
        env:                       # only the espn_fantasy source reads these; it works unauthenticated
          ESPN_S2: ${{ secrets.ESPN_S2 }}     # or not at all, and the probe reports which
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          python scripts/inactives_probe.py \
            --minutes-to "${{ steps.win.outputs.imminent_minutes_to }}" \
            --slate "${{ steps.win.outputs.imminent_slate }}" || true

      - name: Fetch the private Model_Burke package
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true' || steps.win.outputs.grade_due == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MODEL_BURKE_REPO }}
          token: ${{ secrets.MODEL_BURKE_TOKEN }}
          path: pkg

      - uses: actions/setup-python@v5
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true' || steps.win.outputs.grade_due == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sabersim.txt

      - name: Install
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true' || steps.win.outputs.grade_due == 'true'
        run: pip install -q -r requirements-sabersim.txt

      - name: Parse Subvertadown / K-DST pastes (idempotent)
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true'
        run: |
          for f in data/subvertadown/raw/paste_*_wk*.txt data/kdst/paste_*_wk*.txt; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .txt); b=${b#paste_}; s=${b%%_wk*}; w=${b##*_wk}
            python scripts/parse_subvertadown.py "$s" "$w" "$f" || echo "parse failed for $f (continuing)"
          done

      - name: Generate + email
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          MAIL_TO: ${{ vars.MAIL_TO || 'robert.edward.burke@gmail.com' }}
          MODEL_BURKE_PKG: ${{ github.workspace }}/pkg
          PUBLISH_DIR: ${{ github.workspace }}/pkg/sends
          CREDIT_WARN: ${{ vars.CREDIT_WARN || '120' }}
          SEND_WINDOW: ${{ vars.SEND_WINDOW || '58,62' }}
          SLATE_REQ: ${{ inputs.slate }}
        run: |
          python scripts/sabersim_auto.py ${{ inputs.force == 'true' && '--force' || '' }} ${{ inputs.dry_run == 'true' && '--dry-run' || '' }} ${SLATE_REQ:+--slate "$SLATE_REQ"}

      - name: "Publish the CSV to the private repo (needs MODEL_BURKE_TOKEN with Contents write)"
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true'
        run: |
          cd pkg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sends/*.csv sends/*.parquet sends/*.json 2>/dev/null || { echo "no CSV to publish"; exit 0; }
          git commit -m "send $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          git push || echo "publish failed (token is read-only?) — the email still went out"

      # The fan page's projections, rebuilt right after each send, so every game still to play shows the
      # statuses that send just used (Friday's report, then each slate's inactives). Until 2026-09-27 they were
      # rebuilt only on a new FFA file, a Subvertadown paste or the Wednesday fallback, so Sunday's OUTs never
      # reached the page. After the email on purpose: it cannot delay a send, and continue-on-error means it
      # cannot fail the job. Each bake is frozen by id, so codes locked in earlier keep their meaning.
      - name: Rebuild the fan page's projections (after the send)
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MODEL_BURKE_PKG: ${{ github.workspace }}/pkg
        run: |
          SW=$(python -c "import glob,re; ws=sorted((int(m[1]),int(m[2])) for f in glob.glob('data/ffanalytics/FFAn_weekly/raw_stats_*_wk*.csv') for m in [re.search(r'raw_stats_(\d{4})_wk(\d+)\.csv$',f)] if m); print(*ws[-1]) if ws else print('')")
          [ -n "$SW" ] || { echo "no FFA weekly file: fan projections not rebuilt"; exit 0; }
          S=${SW% *}; W=${SW#* }; OUT="outputs/fan/proj_${S}_wk${W}.csv"
          mkdir -p outputs/fan
          echo "rebuilding the fan page's projections for ${S} week ${W}"
          python scripts/sabersim_weekly.py "$MODEL_BURKE_PKG" --all-games --no-market --out "$OUT" \
            && python scripts/fan_proj_bake.py "$OUT" "$S" "$W" \
            || echo "fan projections rebuild failed (the send is unaffected)"

      - name: Daily grade of finished games
        if: steps.win.outputs.grade_due == 'true'
        run: |
          python scripts/sabersim_grade.py --sends pkg/sends outputs/sabersim || echo "nothing to grade yet"
          python scripts/fan_inbox_pull.py --record || echo "fan drop box pull failed (continuing)"
          python scripts/fan_grade.py --sends pkg/sends outputs/sabersim || echo "fan grade failed (continuing)"

      - name: Record the send
        if: steps.win.outputs.in_window == 'true' || inputs.force == 'true' || steps.win.outputs.grade_due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/record_send.py -m "SaberSim send log / grade (automated)" \
            data/sabersim/sent_log.json \
            data/props_frames/snapshots/props_*.csv \
            data/kdst/kdst_*.csv \
            data/subvertadown/subvertadown_long.csv \
            docs/sabersim_accuracy.json \
            docs/fan/grade.json \
            docs/fan/submissions.json \
            docs/fan/proj_latest.json \
            docs/fan/proj_*_wk*.json \
            data/fan_adjustments/fan_adjustments_long.csv \
            data/fan_adjustments/inbox/dropbox.txt \
            outputs/reports/sabersim_accuracy.md
