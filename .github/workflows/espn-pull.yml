name: Pull ESPN league

# Remote-friendly: stores your ESPN cookies as repo Secrets and pulls your league on
# demand, committing outputs/espn_league.json back to the (private) repo. No local files.
#
# One-time setup:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     ESPN_S2   = <your espn_s2 cookie value>
#     ESPN_SWID = {<your SWID cookie value, keep the braces>}
# Then: Actions tab -> "Pull ESPN league" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      leagueId: { description: "League ID", default: "1211359110" }
      season:   { description: "Season",    default: "2026" }
      teamId:   { description: "Your team ID", default: "5" }

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Fetch ESPN league settings + rosters (current season)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/fetch_espn.py "${{ inputs.leagueId }}" "${{ inputs.season }}" "${{ inputs.teamId }}" || echo "settings pull failed (continuing)"
      - name: Fetch historical draft results (2023-2025)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/fetch_espn_drafts.py "${{ inputs.leagueId }}" 2023 2024 2025 || echo "drafts pull failed (continuing)"
      - name: Commit pulled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A outputs/espn_league.json outputs/espn_drafts.csv outputs/espn_drafts.json 2>/dev/null || true
          git commit -m "ESPN pull (automated): league + historical drafts" || { echo "no changes"; exit 0; }
          git push
