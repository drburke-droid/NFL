<style>
  :root{
    --bg:#0f1419;--panel:#1a2230;--panel2:#222d3d;--line:#2c3a4d;--txt:#e6edf3;--muted:#8b9bb0;
    --accent:#4da3ff;--gold:#e0a23c;--good:#39c08a;--bad:#e85d75;
    --qb:#e85d75;--rb:#39c08a;--wr:#4da3ff;--te:#e0a23c;--k:#b07de0;--dst:#7d8a99;
    --t1:#1f6f4a;--t2:#2f5e7e;--t3:#5a4a7a;--t4:#6b5535;--t5:#444f5e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
  /* slim palette-matched scrollbars (nomination ticker, dart-dock columns) */
  .thinscroll{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .thinscroll::-webkit-scrollbar{height:5px;width:5px}
  .thinscroll::-webkit-scrollbar-track{background:transparent}
  .thinscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .thinscroll::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  header{padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0 0 6px;font-size:19px}
  .sub{color:var(--muted);font-size:13px}
  .modebar{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--txt)}
  .layout{display:flex}
  .main{flex:1;padding:14px 24px;min-width:0}
  .side{width:330px;border-left:1px solid var(--line);background:var(--panel);padding:14px;display:none;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:0}
  body.auction .side{display:block}
  .cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:120px}
  .card .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .card .val{font-size:17px;font-weight:600;margin-top:2px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.active{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  .btn.sm{padding:3px 8px;font-size:12px}
  .btn.up{background:var(--gold);border-color:var(--gold);color:#06121f;font-weight:600}
  a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 11px;border-radius:8px;min-width:200px;font-size:13px}
  input.num{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:4px 6px;border-radius:6px;width:56px;font-size:13px;text-align:right}
  label.tgl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{position:sticky;top:0;background:var(--panel2);border-bottom:2px solid var(--line);padding:7px 9px;text-align:right;cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
  thead th.l{text-align:left}
  thead th:hover{color:var(--accent)}
  tbody td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td.l{text-align:left}
  tbody tr:hover{background:#19222f}
  .pos{display:inline-block;width:30px;text-align:center;border-radius:4px;font-weight:700;font-size:11px;padding:2px 0;color:#06121f}
  .pos.QB{background:var(--qb)}.pos.RB{background:var(--rb)}.pos.WR{background:var(--wr)}.pos.TE{background:var(--te)}
  .pos.K{background:var(--k)}.pos.DST{background:var(--dst);color:#fff;width:38px}
  .tier{display:inline-block;min-width:22px;text-align:center;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:600}
  .tier.t1{background:var(--t1)}.tier.t2{background:var(--t2)}.tier.t3{background:var(--t3)}.tier.t4{background:var(--t4)}.tier.t5{background:var(--t5)}
  .name{font-weight:600}
  .bid{font-weight:700;color:var(--gold)}
  .base{color:var(--muted)}
  .upc{color:var(--good)}.downc{color:var(--bad)}.muted{color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}
  .flexstar{color:var(--te);font-weight:700;font-size:11px}
  .lowconf{color:#7d8a99;font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;text-transform:uppercase;margin-left:4px}
  .tag{font-size:10px;border-radius:3px;padding:0 4px;text-transform:uppercase;margin-left:4px;font-weight:700}
  .tag.rook{background:#b07de0;color:#06121f}.tag.brk{background:#39c08a;color:#06121f}
  .tag.won{background:#e0a23c;color:#06121f}
  .tag.vac{background:#5ad1c8;color:#06121f}
  .tag.agerisk{background:#7a3b46;color:#ffd9e0}
  .arch{font-size:10px;color:var(--muted);margin-left:6px;font-style:italic}
  .jc{cursor:pointer}.jc:hover{color:var(--accent);text-decoration:underline}
  .slabel{fill:#e6edf3;font-size:12px;paint-order:stroke;stroke:#0f1419;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
  .sleg{display:flex;gap:16px;align-items:center;margin:4px 0 8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .sleg b{color:var(--txt)} .sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .dr-teams{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .dr-team{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:162px;font-size:12px;cursor:pointer}
  .dr-team.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

  .drmodal{position:fixed;inset:0;background:rgba(5,10,18,.75);display:flex;align-items:center;justify-content:center;z-index:60}
  .drmodal .box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:360px;max-width:560px;box-shadow:0 8px 40px rgba(0,0,0,.5)}

  .drmodal .own button{padding:6px 4px;font-size:12px;line-height:1.25;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--txt);cursor:pointer}
  .drmodal .own button:hover{border-color:var(--accent)}
  .drmodal .own button.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .drmodal .own button:disabled{opacity:.35;cursor:default}
  .dr-team .nm{font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  .dr-team .bud{color:var(--good);font-weight:700}
  .dr-team .nd{margin-top:3px;line-height:1.7}
  .dr-need{display:inline-block;font-size:10px;border-radius:3px;padding:0 4px;margin:1px;background:var(--panel2);color:var(--muted)}

  .dr-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:12px}
  .dr-panel h3{margin:0 0 8px;font-size:14px}
  .drsel,.drnum{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;font-size:12px;padding:3px 5px}
  .drnum{width:48px;text-align:right}
  .pivot{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);font-size:12px}
  .maxbid{font-weight:700;color:var(--gold)}
  .scarce{color:var(--bad);font-weight:700}
  .side h3{margin:0 0 8px;font-size:14px}
  .infl{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px}
  .infl .big{font-size:20px;font-weight:700}
  .infl .row{display:flex;justify-content:space-between;color:var(--muted);margin-top:3px}
  .infl .row b{color:var(--txt)}
  .kp{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px solid var(--line)}
  .kp .kn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .kp .sur{font-size:11px;font-weight:600;min-width:42px;text-align:right}
  .kp .x{cursor:pointer;color:var(--bad);font-weight:700}
  .keepbtn{cursor:pointer;color:var(--accent);font-weight:700;font-size:12px}
  .empty{color:var(--muted);font-size:12px;padding:8px 0}
  .settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}
  .ffabar{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
  .ffastat{color:var(--good);font-weight:600}
  .wbcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .wbcard h3{margin:0 0 10px;font-size:14px}
  .wbtbl{width:100%;border-collapse:collapse;font-size:12px}
  .wbtbl th{text-align:left;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px;font-weight:600}
  .wbtbl td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .wbq{color:var(--good);font-weight:700} .wbbad{color:var(--bad);font-weight:700}
  .wbin{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;font-size:12px;padding:3px 5px;width:64px}
  .wbin.wide{width:210px}
  .wbig{font-size:24px;font-weight:800}
  .wbstat{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px}
  .wbstat .lb{color:var(--muted);font-size:11px}
</style>

<script>
// ---------- state ----------
let mode="cheat",posFilter="ALL",startersOnly=false,draftableOnly=false,sortKey="overall_rank",sortDir=1,query="";
// Default to BLEND. Walk-forward 2016-2025, rank-vs-actual-finish per season+position:
// model-only .519, blend@0.65 .547, pure FFA .545 — blend beats model-only in 27/40
// groups (p=0.0002). Ordering is what a draft actually consumes, so model-only is the
// wrong default. Falls back to model if no FFA is available.
let projMode=localStorage.getItem("projMode")||"blend";
let cfg=JSON.parse(localStorage.getItem("draft_cfg")||'null')||{teams:12,budget:200,roster:16};
let kept=JSON.parse(localStorage.getItem("draft_keepers")||'{}');
// Seed from the baked league-scored consensus (docs/ffa_2026.js, built by
// scripts/build_ffa_js.py) so Blend/FFA work on ANY machine with no upload —
// they used to be dead unless you'd uploaded the CSV in *this* browser, which made
// them silently unavailable on the draft-night PC.
// An upload still wins. The "ffaUploaded" flag is what distinguishes the two, since
// save() re-persists ffaMap on every state change and would otherwise make the
// baked map look like an upload.
const FFA_HAVE_BAKED=(typeof FFA_BAKED!=="undefined")&&Object.keys(FFA_BAKED).length>0;
const ffaIsUpload=()=>localStorage.getItem("ffaUploaded")==="1";
let ffaMap=ffaIsUpload()?(JSON.parse(localStorage.getItem("ffa2026")||'null')||{})
                        :(FFA_HAVE_BAKED?FFA_BAKED:{});
const pid=p=>p.name+"|"+p.position+"|"+(p.team||"");
const BYID={}; PLAYERS.forEach(p=>BYID[pid(p)]=p);
const isK=p=>p.position==="K"||p.position==="DST";
// ---- risk-adjusted (certainty-equivalent) value: discount points by MEASURED risk ----
// injury risk = % of startable-tier seasons missing significant time, by position (qb_reliability.py)
const POS_INJ={QB:0.26,RB:0.40,WR:0.33,TE:0.39};
const K_RISK=0.7;                                  // risk-aversion level (shape from data; level market-anchored)
function playerRisk(p){
  if(isK(p))return 0;
  const ppg=p.proj_ppg||0, fl=(p.floor==null?ppg:p.floor), bu=(p.bust==null?0.30:p.bust);
  const inj=Math.max(0,(((POS_INJ[p.position]||0.33)-0.26)/0.14));   // 0 = QB safest .. 1 = RB riskiest
  const down=ppg>0?Math.max(0,(ppg-fl)/ppg):0;                       // floor gap (downside)
  return Math.min(0.9, 0.45*inj + 0.40*bu + 0.30*down);
}
// FULL-SEASON VALUE: value established players on ppg x a normal-season games baseline so a
// resolved past injury (low projected games) doesn't bury a healthy bounce-back. Only ever LIFTS
// (max with proj_pts) — targets injury-returns, never inflates the healthy board. Baseline =
// median games among each position's projected starters (rookies excluded).
const _DEMANDG={QB:12,RB:24,WR:24,TE:12},NORMG={};
["QB","RB","WR","TE"].forEach(pos=>{const arr=PLAYERS.filter(p=>p.position===pos).sort((a,b)=>(b.proj_pts||0)-(a.proj_pts||0)).slice(0,_DEMANDG[pos]);
  const gs=arr.map(p=>p.proj_games).filter(x=>x).sort((a,b)=>a-b); NORMG[pos]=gs.length?gs[Math.floor(gs.length/2)]:15;});
// validated walk-year (contract-year) PPG bump — improves projection MAE (scripts/contract_year_mae.py)
const cstat=p=>(typeof CONTRACT_STATUS!=="undefined")?CONTRACT_STATUS[p.name]:null;
const cbump=p=>{const c=cstat(p); return (c&&c.bump)?c.bump:0;};
// validated clean-vacancy WR+RB inheritor bump (scripts/vacated_role_backtest_all.py: +1.4-1.7 vs control, MAE-safe)
const VCAN={GNB:'GB',KAN:'KC',LVR:'LV',OAK:'LV',NOR:'NO',NWE:'NE',SFO:'SF',TAM:'TB',SD:'LAC',STL:'LAR',LA:'LAR',WSH:'WAS',JAC:'JAX'};
const vcan=t=>VCAN[t]||t;
let VAC_DYNAMIC=null;   // recomputed from the FFA file's team column (true rosters) when uploaded; else static VACATED_ROLE
function computeVacated(team26){   // team26: canonical name -> 2026 team; re-derives flags from VAC_DATA ingredients
  if(typeof VAC_DATA==="undefined") return null;
  const U=VAC_DATA.usage,D=VAC_DATA.drafted,PA=VAC_DATA.params,out={},bt={};
  for(const n in U){(bt[U[n].tm]=bt[U[n].tm]||[]).push(n);}
  for(const A in bt){const names=bt[A];
    for(const pos in PA){const P=PA[pos];
      const dep=names.filter(n=>U[n].pos===pos&&U[n].sh>=P.vac&&(team26[n]||U[n].tm)!==A);
      if(!dep.length||(D[pos]||[]).indexOf(A)>=0)continue;
      const hold=names.filter(n=>U[n].pos===pos&&(team26[n]||U[n].tm)===A&&U[n].sh>=P.lo&&U[n].sh<=P.hi);
      if(!hold.length)continue;
      const inh=hold.reduce((a,b)=>U[b].sh>U[a].sh?b:a),dg=dep.reduce((a,b)=>U[b].sh>U[a].sh?b:a);
      out[inh]={bump:P.bump,pos:pos,team:A,vac_share:Math.round(U[dg].sh*100),departed:dg,ffa:true};}}
  return out;
}
function refreshVacatedFromFFA(){   // use the uploaded FFA file's team column as TRUE 2026 rosters, if present
  VAC_DYNAMIC=null;
  if(typeof VAC_DATA==="undefined"||!Object.keys(ffaMap).length) return;
  const t26={}; let have=false;
  PLAYERS.forEach(p=>{const f=ffaMap[fkey(p.name,p.position)]; if(f&&f.team){t26[p.name]=vcan(f.team);have=true;}});

// Pasted from ESPN's Live Draft Trends page into a .txt and uploaded (📈 button in the Draft
// Room / Mock Draft). Format: repeating blocks of rank / NameName / Name / team / pos / ADP /
// ADP-trend / AVG AUCTION $ / auction-trend / %rostered. Anyone NOT listed goes for ~$1 in
// sitewide drafts. THE BOTS BENCHMARK ON THIS PUBLIC DATA (it's what the room sees); our
// Exp $ / Value engine (league history + per-player anchors + FFA) stays the proprietary edge.

function parseEspnTrends(txt){
  // tolerant block parser: rank / NameName (doubled) / Name / [injury tag] / team / POS /
  // ADP / ADP-trend / AVG AUCTION $ / trend / %rostered — extra status lines shift the block,
  // so anchor on the doubled-name line and scan forward for the position line.
  const POSSET={QB:1,RB:1,WR:1,TE:1,K:1,"D/ST":1};
  const L=txt.split(/\r?\n/).map(s=>s.trim()).filter(s=>s!=="");
  const num=s=>/^[+-]?\d+(\.\d+)?$/.test(s);
  const map={};let n=0;
  for(let i=0;i<L.length-6;i++){
    if(!/^\d+$/.test(L[i]))continue;
    const d=L[i+1],half=d.slice(0,Math.floor(d.length/2));
    if(d.length<4||half!==d.slice(Math.floor(d.length/2)))continue;   // doubled-name anchor
    let j=-1;for(let k=i+2;k<=i+7&&k<L.length;k++){if(POSSET[L[k]]){j=k;break;}}
    if(j<0||!num(L[j+1])||!num(L[j+3]))continue;                      // pos, then ADP / trend / AUCTION $
    const pos=L[j]==="D/ST"?"DST":L[j];
    map[fkey(half,pos)]={av:parseFloat(L[j+3]),adp:parseFloat(L[j+1])};
    n++;i=j+3;
  }
  return {map,n,ts:Date.now()};
}

// ---------- projection / VORP (recomputed for FFA mode) ----------
function recomputeSkillVorp(){
  const skill=PLAYERS.filter(p=>!isK(p));
  const BASE={QB:cfg.teams,RB:cfg.teams*2,WR:cfg.teams*2,TE:cfg.teams};
  ["QB","RB","WR","TE"].forEach(pos=>{
    skill.filter(p=>p.position===pos).sort((a,b)=>b._proj-a._proj).forEach((p,i)=>p._prk=i+1);
  });
  const flexPool=skill.filter(p=>["RB","WR","TE"].includes(p.position)&&p._prk>BASE[p.position])
                      .sort((a,b)=>b._proj-a._proj).slice(0,cfg.teams);
  const fc={}; flexPool.forEach(p=>fc[p.position]=(fc[p.position]||0)+1);
  const repl={};
  ["QB","RB","WR","TE"].forEach(pos=>{
    const arr=skill.filter(p=>p.position===pos).sort((a,b)=>b._proj-a._proj).map(p=>p._proj);
    const st=BASE[pos]+(["RB","WR","TE"].includes(pos)?(fc[pos]||0):0);
    repl[pos]=st<arr.length?arr[st]:arr[arr.length-1];
  });
  skill.forEach(p=>p._vorp=p._proj-repl[p.position]);
}
function applyProjection(){
  if(projActive()){
    const blend=(projMode==="blend"||projMode==="all"), st={};
    if(blend){   // per-position rescale FFA to the model's scale (robust to different scoring) before blending
      ["QB","RB","WR","TE"].forEach(pos=>{
        const a=PLAYERS.filter(p=>p.position===pos&&ffaMap[fkey(p.name,p.position)]);
        const mp=a.map(p=>p.proj_pts||0), fp=a.map(p=>ffaMap[fkey(p.name,p.position)].pts||0);
        const mn=x=>x.reduce((s,v)=>s+v,0)/(x.length||1), sd=x=>{const m=mn(x);return Math.sqrt(x.reduce((s,v)=>s+(v-m)*(v-m),0)/(x.length||1))||1;};
        st[pos]={mm:mn(mp),ms:sd(mp),fm:mn(fp),fs:sd(fp)};
      });
    }
    PLAYERS.forEach(p=>{
      p._ffa=ffaMap[fkey(p.name,p.position)]||null;
      if(isK(p)){p._proj=p.proj_pts;p._vorp=p.vorp;return;}
      if(!p._ffa){p._proj=p.proj_pts;return;}                 // unmatched -> model
      if(blend){const s=st[p.position]||{ms:1,fs:1,mm:0,fm:0};
        const ffaScaled=s.mm+(p._ffa.pts-s.fm)*(s.ms/s.fs);   // FFA rescaled to model level
        p._proj=(1-BLEND_W)*(p.proj_pts||0)+BLEND_W*ffaScaled;
      }else p._proj=p._ffa.pts;                                // pure FFA swap
    });
    recomputeSkillVorp();
  }else{
    PLAYERS.forEach(p=>{p._proj=p.proj_pts;p._vorp=p.vorp;p._ffa=null;});
  }
}

// ---------- auction engine (uses effective VORP) ----------
function computeValues(keepers){
  const totalSpots=cfg.teams*cfg.roster,totalMoney=cfg.teams*cfg.budget;
  const ids=Object.keys(keepers),kset=new Set(ids);
  const kdstSlots=cfg.teams*2;
  const keptKDST=ids.filter(id=>BYID[id]&&isK(BYID[id])).length;
  const kdstReserve=Math.max(kdstSlots-keptKDST,0);
  const skillSpots=totalSpots-kdstSlots;
  const skillKeepers=ids.filter(id=>BYID[id]&&!isK(BYID[id]));
  const skillSpotsRem=Math.max(skillSpots-skillKeepers.length,0);
  const sumSal=ids.reduce((a,id)=>a+(+keepers[id]||0),0);
  const skillMoney=totalMoney-kdstReserve-sumSal;
  const pool=PLAYERS.filter(p=>!isK(p)&&!kset.has(pid(p))).sort((a,b)=>VP(b)-VP(a)).slice(0,skillSpotsRem);
  const poolSet=new Set(pool.map(pid));
  const sumV=pool.reduce((a,p)=>a+Math.max(VP(p),0),0);
  const disc=Math.max(skillMoney-skillSpotsRem,0);
  const per=sumV>0?disc/sumV:0;
  const vals={};
  PLAYERS.forEach(p=>{const id=pid(p);
    if(kset.has(id)){vals[id]=+keepers[id]||0;return;}
    if(isK(p)){vals[id]=p.pos_rank<=6?2:(p.pos_rank<=cfg.teams?1:0);return;}
    vals[id]=poolSet.has(id)?Math.max(1,Math.round(1+Math.max(VP(p),0)*per)):(VP(p)>0?1:0);
  });
  return {vals,per,skillMoney,skillSpotsRem,sumSal,disc};
}

    if(!name||!["QB","RB","WR","TE"].includes(pos)) continue;
    const pts=parseFloat(c[iPts]); if(isNaN(pts)) continue;
    const iAav=idx("aav");
    m[fkey(name,pos)]={pts:pts, adp:iAdp>=0?parseFloat(c[iAdp]):null, tier:iTier>=0?parseInt(c[iTier]):null,
      posrank:iPr>=0?parseInt(c[iPr]):null, ceil:iCe>=0?parseFloat(c[iCe]):null, floor:iFl>=0?parseFloat(c[iFl]):null,
      unc:iUn>=0?parseFloat(c[iUn]):null, aav:iAav>=0?parseFloat(c[iAav]):null,
      team:iTm>=0?(c[iTm]||"").toUpperCase().replace(/[^A-Z]/g,""):null};
    n++;
  }
  return {m,n};
}

// RB age tiebreaker. Validated 2016-25: take two RBs in the same season projected
// within 10% of each other and 4+ years apart — the YOUNGER outscored the older
// 59.0% of the time (510/864, p<0.0001), and 58.6% among draftable RBs (p=0.0006).
// WR 52.6% and QB 54.0% are far weaker; TE shows nothing (52.4%, p=0.35), so this
// is RB-only on purpose.
//
// Deliberately a TAG, not a projection edit. An explicit age multiplier on RB
// projections was fitted walk-forward and REJECTED: it made MAE 4.8% worse at full
// strength and no shrinkage dose beat the current board (best was +0.07%, noise).
// The bias is real in aggregate but swamped by RB variance at the player level, so
// it survives as a tiebreaker and dies as a number. Do not re-add the multiplier.
function rbAgeTag(p){
  if(p.position!=="RB"||p.age==null)return "";

  if(a<=24)return ` <span class="tag won" title="Young RB (age ${a}). At equal projection the younger RB beat the older one 59% of the time (2016-25, n=864, p<0.0001). Tiebreaker only — the projection itself is unchanged.">⬆ YOUTH</span>`;
  if(a>=28)return ` <span class="tag agerisk" title="RB age ${a}. At equal projection the younger RB won 59% of head-to-heads (2016-25, n=864, p<0.0001). FFA also over-projects 28+ RBs by ~23% vs ~6% for 23-and-under. Tiebreaker only — the projection itself is unchanged.">⚠ RB AGE</span>`;
  return "";
}

// wherever a player is listed, so a 79%-kept star can't quietly top your target list.

  if(typeof KEEPERS_2026!=="undefined"&&typeof KEEPER_PROB!=="undefined")
    for(const t of KEEPERS_2026.teams) for(const c of (t.candidates||[])){
      const pr=KEEPER_PROB[c.pid];

  const r=KRISK[norm(p.name)+"|"+p.position];
  if(!r||keptBy(p))return "";                    // already locked in the room: no warning needed
  const pc=Math.round(r.p*100);
  if(pc<30)return "";                            // realistically available — stay quiet

  return ` <span class="tag ${cls}" title="${r.team} holds him at $${r.cost} — modelled ${pc}% chance they keep him, fitted on this league's actual 2023-25 keeper decisions. He may never reach the auction, so do not build a plan around him. Confirm in 🧩 Mock Keepers.">🔒 ${lbl} ${pc}%</span>`;

// ---------- 💰 Auction $ multi-source market board ----------
// _AUC is rebuilt on every auction-mode render: exp = the algo's expected purchase price
// (dynamicMarket: league 2023-25 bid curve × per-player anchors, keeper-aware), rv = worth
// in room dollars. Alongside: ESPN trends $ (uploaded), FFA AAV (uploaded CSV or baked
// data.js fallback), FFC crowd ADP (live 12-team PPR mocks, fetch_ffc_adp.py).
let _AUC=null;
function buildAuctionMkt(){
  const mkt=dynamicMarket(),BV=baseValue(),IF=mkt.infl||1;
  _AUC={exp:{},rv:{},eng:{}};
  PLAYERS.forEach(p=>{const id=pid(p);
    _AUC.exp[id]=Math.max(1,Math.round(mkt.price[id]||1));
    _AUC.eng[id]=Math.max(1,Math.round(mkt.engine[id]||1));
    _AUC.rv[id]=Math.max(1,Math.round((BV[id]||0)*IF));});
}
const auctionAAV=p=>{const f=Object.keys(ffaMap).length?ffaMap[fkey(p.name,p.position)]:null;
  return (f&&f.aav!=null&&!isNaN(f.aav))?f.aav:(p.ffa_aav!=null?p.ffa_aav:0);};
const mktAvg=p=>{if(isK(p))return 0;
  const src=[_AUC?_AUC.exp[pid(p)]:null,espnLoaded()?(espnAV(p)||null):null,auctionAAV(p)||null]
    .filter(v=>v!=null&&v>0);
  return src.length?src.reduce((a,b)=>a+b,0)/src.length:0;};
// keeper-locked (🧩 Mock Keepers / DR.owned) — not purchasable, so the market columns
// show "K" / "—" instead of a meaningless $1 expected price
const keptBy=p=>{const o=(typeof DR!=="undefined")&&DR.owned[pid(p)];return (o&&o.kept)?o:null;};
// ⚠ market-gap flag (price audit 2026-07-17): when our Exp $ sits >= $12 from the mean of
// ESPN $ + FFA AAV (both present), surface it with WHY — every audited outlier traced to a
// deliberate mechanism, so the flag explains which number to trust rather than hiding it.
const mktGap=p=>{if(isK(p)||keptBy(p)||!_AUC)return 0;
  const es=espnAV(p),av=auctionAAV(p);if(!(es>3&&av>3))return 0;
  const d=(_AUC.exp[pid(p)]||1)-(es+av)/2;return Math.abs(d)>=12?d:0;};
const mktGapWhy=p=>{const why=[];
  if(typeof HEALTHY_PPG!=="undefined"&&HEALTHY_PPG[p.name])why.push(`healthy-rate conviction — we price his HEALTHY per-game (${HEALTHY_PPG[p.name]} ppg) while the national market prices the injury risk`);
  if(typeof PRICE_ANCHOR!=="undefined"&&Object.keys(PRICE_ANCHOR).some(k=>k.indexOf(p.name+"|"+p.position)===0))why.push("room anchor — fitted on what THIS league actually paid him (validated 20% sharper than the curve alone)");
  if(p.is_rookie===1)why.push("rookie — our Exp $ stays on the league curve; national hype can run ahead of it");
  return why.length?why.join(" · "):"model-vs-market disagreement — check for news before trusting either number";};
function gv(p,k){
  if(k==="bid")return ADJ.vals[pid(p)]??0;
  if(k==="base")return BASE.vals[pid(p)]??0;
  if(k==="proj")return PRJ(p);
  if(k==="vorp")return VP(p);
  if(k==="upside")return upside(p)??-1;
  if(k==="ffa_adp")return p._ffa?(p._ffa.adp??999):999;
  if(k==="ffa_tier")return p._ffa?(p._ffa.tier??99):99;
  if(k==="overall_rank")return ffaOn()?-VP(p):p.overall_rank;
  if(k==="pos_rank")return projActive()?(p._prk??p.pos_rank):p.pos_rank;
  if(k==="mexp")return keptBy(p)?0:(_AUC?(_AUC.exp[pid(p)]||1):0);
  if(k==="espn$")return espnAV(p)||0;
  if(k==="aav")return auctionAAV(p);
  if(k==="mavg")return keptBy(p)?0:mktAvg(p);
  if(k==="mval")return _AUC?(_AUC.rv[pid(p)]||1):0;
  if(k==="medge")return keptBy(p)?-9999:(_AUC?(_AUC.rv[pid(p)]||1):0)-mktAvg(p);
  if(k==="ffc")return p.ffc_adp!=null?-p.ffc_adp:-9999;   // negative: default desc sort puts earliest picks first
  return p[k];
}

// 🎯 the running list of players I WANT, in nomination-priority order: plan starters by
// irreplaceability, then the plan's bench darts, then next-up high Dart/Leap RB/WR pivots,
// K/DST streams last. The sim bot nominates straight off this list on my turn.
function myTargetList(plan,extra){
  const inPlan=new Set(plan.picks.map(pk=>pid(pk.p)));
  const starters=plan.picks.filter(pk=>pk.wa!=null).slice().sort((a,b)=>(b.du||0)-(a.du||0)).map(pk=>pk.p);
  const bench=plan.picks.filter(pk=>pk.slot==="BN").map(pk=>pk.p);
  const kd=plan.picks.filter(pk=>pk.slot==="K"||pk.slot==="DST").map(pk=>pk.p);
  // PIVOT LIST: still-available dart targets, ranked by the backtested composite (dartScore)
  // when present, else the raw dart signal. Broadened to TE (bench_darts includes TE darts).
  const darts=PLAYERS.filter(p=>!DR.owned[pid(p)]&&!inPlan.has(pid(p))&&["RB","WR","TE"].includes(p.position)&&(dartScore(p)!=null||dartSig(p)>=0.15||isPinned(p)))
    .sort((a,b)=>(isPinned(b)?1:0)-(isPinned(a)?1:0)||((dartScore(b)??dartSig(b))-(dartScore(a)??dartSig(a)))).slice(0,extra||10);
  return {starters,bench,darts,kd,all:[...starters,...bench,...darts,...kd]};
}

function scarcityPanelHTML(mkt){

    let lab;

    else if(sc.edge<=2) lab=`<span class="scarce">SCARCE — only ${sc.edge} player${sc.edge>1?'s':''} with a real edge left for ${sc.demand} open slot${sc.demand>1?'s':''}; pay up or you're stuck with replacement</span>`;
    else lab=`${sc.edge} players with an edge for ${sc.demand} open slots — a few worth a premium, then it flattens`;
    h+=`<div style="font-size:12px;margin-bottom:2px"><b>${pos}</b>: ${lab}
      <div class="muted" style="font-size:10px;margin-left:8px" title="scripts/positional_fill_study.py (2016-25): opp = season pts you can't recover from cheap picks/waivers if you skip tier-1; late bin = P(a $1-3 pick, FFA ADP 100-170, that flashed by wk4 delivers starter-level weeks 5-17); wire fill = the competition-adjusted (3rd-best) PPG a pure waiver add delivers">🧭 skip tier-1 = <b>~${F.opp} pts unrecoverable</b> · $1-3 bin hits a starter ${F.late}% of yrs${F.lateElite>=50?` <b class="upc">(an ELITE one ${F.lateElite}%)</b>`:''} · pure-wire fill ≈${F.wire3} ppg → <b>${FILL_VERDICT[pos]}</b></div></div>`;});

// Import the JSON produced by scripts/fetch_espn.py: set league size/budget/roster, team
// names, my team, and pre-load keepers (matched to our players by name+position).
function importEspnLeague(txt){
  let L; try{ L=JSON.parse(txt); }catch(e){ alert("Not valid JSON. Use the file from scripts/fetch_espn.py."); return; }
  if(!L.teams||!L.teams.length){ alert("No teams found in that file."); return; }
  const slots=L.roster_slots||{};
  const startN=(slots.QB||0)+(slots.RB||0)+(slots.WR||0)+(slots.TE||0)+(slots.FLEX||0)+(slots.K||0)+(slots.DST||0)+(slots.OP||0);
  cfg.teams=L.size||L.teams.length;
  cfg.roster=Object.entries(slots).filter(([k])=>k!=="IR").reduce((a,[,v])=>a+v,0)||cfg.roster;
  cfg.budget=(L.draft&&L.draft.auctionBudget)||cfg.budget;
  // order teams by ESPN id; remember mapping id->index
  const ordered=[...L.teams].sort((a,b)=>a.id-b.id);
  const idx={}; DR.teams=ordered.map((t,i)=>{idx[t.id]=i; return {name:t.name||("Team "+(i+1))};});
  DR.me=idx[L.myTeamId]!=null?idx[L.myTeamId]:0;
  DR.owned={};
  // build name+pos lookup over our player pool
  const byNP={}; PLAYERS.forEach(p=>{byNP[norm(p.name)+"|"+p.position]=p;});
  let matched=0, miss=[];
  ordered.forEach((t,i)=>t.roster.forEach(r=>{ if(!r.keeper) return;
    const p=byNP[norm(r.name)+"|"+r.pos]; if(!p){ miss.push(r.name); return; }
    DR.owned[pid(p)]={t:i, price:(+r.keeper_price||1), kept:true}; matched++;
  }));
  // ESPN's keeperValue is the PRICE to keep, set on every rostered player — post-deadline
  // it flags whole rosters as "keepers". The baked-in FINAL selections outrank it.
  applyFinalKeepers();
  save(); saveDR();
  document.getElementById("espnStatus").innerHTML=`Imported <b>${L.name||"league"}</b>: ${DR.teams.length} teams, ${startN} starters + ${slots.BENCH||0} bench, $${cfg.budget} budget · ${matched} keepers loaded`+(miss.length?` · unmatched: ${miss.slice(0,6).join(", ")}${miss.length>6?"…":""}`:"");
  render();
}

//   * Bijan (P=0.79) and Drake Maye (0.75) were predicted=false — keeping them loses money
//     — so the board left them in the pool and ranked players you can never actually buy.
//   * Matthew Stafford (P=0.04), Christian Watson (0.12), Rico Dowdle (0.18) were
//     predicted=true because keeping them is +EV, so the board REMOVED available bargains.
// Owners keep stars at a loss and dump cheap value; behaviour predicts that, economics
// does not. KEEPER_PROB is fitted on this league's real 2023-25 keeper decisions.
// Still capped at the league's 3-keeper limit, highest likelihood first.
const keepProbOf=c=>{const p=(typeof KEEPER_PROB!=="undefined")?KEEPER_PROB[c.pid]:null;
  return p!=null?p:(c.predicted?0.9:0.1);};
// Self-calibrating cutoff. The probabilities sum to the model's own expected keeper
// count (~31.4 for 2026, against 31 kept in 2024 and 30 in 2025), so pick the threshold
// whose ticked count lands closest to that expectation instead of hardcoding one. A
// naive 0.60 cutoff ticks only 9 and would leave ~20 players who WILL be kept sitting
// in your pool — the same bug in a smaller costume. Re-calibrates if the model is refit.
function keepCount(th){let n=0;KEEPERS_2026.teams.forEach(t=>{
  n+=(t.candidates||[]).filter(c=>keepProbOf(c)>=th).sort((a,b)=>keepProbOf(b)-keepProbOf(a)).slice(0,3).length;});
  return n;}
const KEEP_LIKELY=(()=>{
  if(typeof KEEPERS_2026==="undefined")return 0.5;
  let exp=0;KEEPERS_2026.teams.forEach(t=>(t.candidates||[]).forEach(c=>{exp+=keepProbOf(c);}));
  let best=0.30,bd=Infinity;
  for(let th=0.10;th<=0.85;th+=0.01){const d=Math.abs(keepCount(th)-exp);if(d<bd){bd=d;best=th;}}
  return best;})();
function resetPredicted(){

  KEEPERS_2026.teams.forEach((t,i)=>{
    (t.candidates||[]).filter(c=>keepProbOf(c)>=KEEP_LIKELY)

// per-owner historical positional spend tendencies (multipliers vs league) from keepers_2026.js
function ownerTend(i){return (KEEPERS_2026.teams[i]&&KEEPERS_2026.teams[i].tend)||{QB:1,RB:1,WR:1,TE:1,payTE:false,eliteQB:false,top:0};}
function tendLabel(td){const o=[];["RB","WR","QB","TE"].forEach(p=>{if(td[p]>=1.3)o.push("loves "+p);else if(td[p]<=0.65)o.push("light "+p);});
  if(td.eliteQB&&td.QB>=1.1)o.push("pays QB"); if(td.payTE&&td.TE>=1.2)o.push("pays TE");

// realistic remaining demand for a MEANINGFUL (>$1) player at pos, given roster construction:
// teams roster 2 QB but only 1 costs >$1; ~1 paid TE (backup is $1); K & DST are $1 streams;
// the rest of the roster is split between RB/WR (starter + flex + bench depth).
// HARD POSITIONAL CAPS from the league's real post-auction rosters (35 team-seasons 2023-25):
// no team has EVER rostered >2 TE or >3 QB (31/35 carry exactly 2 QB), K/DST are singles,
// RB tops at 6 and WR at 7. Without these caps payTE owners hoarded 4-6 TEs in sims.
const POS_CAP={QB:2,RB:6,WR:7,TE:2,K:1,DST:1};
const posCount=(s,pos)=>s.own.filter(x=>x.p.position===pos).length;
function posDemand(s,pos,td){
  if(posCount(s,pos)>=(POS_CAP[pos]||99)) return 0;
  if(pos==="K"||pos==="DST") return 0;
  if(pos==="QB") return s.need.QB>0?1:(s.bench>0?0.25:0);         // league norm IS a 2nd QB (31/35 rosters) — late, cheap
  if(pos==="TE") return s.need.TE>0?1:(td.payTE&&s.bench>0?0.3:0);// one paid TE; a capped 2nd only if they pay TE
  return (s.need[pos]>0?1:0)+(s.need.FLEX>0?0.6:0)+(s.bench>0?0.4:0); // RB/WR: starter+flex+bench stockpile

// genuine starter-need teams surfaced ahead of bench-depth buyers.

// ================= MOCK DRAFT (every owner is a bot) =================
// Each team bids like ITS owner: the live bid-curve market price (dynamicMarket — keepers,
// demand and inflation all included) shaped by that owner's 2023–25 auction personality
// (positional lean, star appetite = his historical top buy, elite-QB / pay-TE habits), his
// remaining budget aggression, and his live roster needs — plus a per-draft seeded wobble so
// every mock plays out a little differently. Winner pays runner-up max +$1 (English auction).
let MD=JSON.parse(localStorage.getItem("mockdraft")||"null")||{on:false,nom:0,seed:7,log:[],block:null,sel:null};
const saveMD=()=>localStorage.setItem("mockdraft",JSON.stringify(MD));

// never destroy LIVE draft progress: picks this mock didn't make (drafted count ≠ mock log) are
// backed up before any bulk clear, and ↩ Restore puts them back. Mock-made picks are disposable
// and never overwrite the backup.
const MD_SNAP="draftroom_pre_mock";
function mdForeign(){const n=Object.keys(DR.owned).filter(id=>!DR.owned[id].kept).length;
  return n&&n!==MD.log.length?n:0;}
function mdBackup(){if(mdForeign())localStorage.setItem(MD_SNAP,JSON.stringify(DR.owned));}
function mdRestore(){const s=localStorage.getItem(MD_SNAP);if(!s)return;

// stable per-(draft,owner,player) wobble ±12%: same all draft (an owner doesn't flip-flop on a
// player), different next mock (press Start again for a fresh room)
function mdJit(i,id){let x=(MD.seed*2654435761)^(i*40503+40009);
  for(let k=0;k<id.length;k++)x=(x*31+id.charCodeAt(k))|0;
  x^=x<<13;x^=x>>>17;x^=x<<5;return 0.88+((x>>>0)%1000)/1000*0.24;}
// what team i would realistically pay for p RIGHT NOW.
// ANCHOR = the league's real winning-bid distribution (bidcurve_pos: every non-keeper auction
// price 2023–25, rank-ordered per position). Those bids were ALREADY paid in keeper-inflated
// rooms, so we bid on the RAW curve value at the player's live slot — applying the room's
// inflation rescale again would double-count it (that's how Nabers was running to $80 when this
// league has never paid a WR past ~$64). Personality only SHADES the curve (tight ±20%), and two
// hard dollar ceilings from history close it out: the owner's own biggest-ever buy, and the
// position's all-time top price.
// NFL-team fandom (scripts/owner_bias.py, mined from 2023-25 bids): the multiplier this owner
// stretches for players on his fan team (e.g. silverandblack -> LV x1.3: paid $71 for Jeanty)
function ownerFan(i,p){
  if(typeof OWNER_BIAS==="undefined"||typeof KEEPERS_2026==="undefined"||!KEEPERS_2026.teams[i])return 1;
  const b=OWNER_BIAS[KEEPERS_2026.teams[i].owner];
  return (b&&b.fan&&b.fan[team26(p)])||1;

function ownerBid(i,p,mkt,TS){
  const s=TS[i]; if(s.spotsLeft<=0)return 0;
  const afford=s.budget-(s.spotsLeft-1); if(afford<1)return 0;
  const pos=p.position,td=ownerTend(i),id=pid(p);
  if(isK(p))return s.need[pos]>0?1:0;                                   // $1 streams
  if(posDemand(s,pos,td)<=0)return 0;                                   // no realistic use
  let raw=1+((mkt.price[id]||1)-1)/(mkt.infl||1);                       // un-inflated curve $ at his live slot
  // PUBLIC BENCHMARK: when ESPN live-trend data is loaded, bots anchor 65% on the sitewide
  // average auction $ (what the room actually sees) and 35% on this league's own curve.
  // Unlisted players go ~$1 in public drafts, so bots won't pay up for them — while OUR
  // board (league history + anchors + FFA) still can: that asymmetry is the edge.
  if(espnLoaded()){const eav=espnAV(p);raw=eav>0?0.65*eav+0.35*raw:Math.min(raw,2);}
  const fan=ownerFan(i,p);                                              // fandom stretches the whole bid
  const starter=(s.need[pos]>0)||(FLEXE.includes(pos)&&s.need.FLEX>0);
  const leagueAvg=mkt.spots>0?mkt.money/mkt.spots:1;
  // flushness: money-per-spot vs the room. Nobody leaves cash on the table — a flush team bids
  // well OVER curve on players it needs (the hard star ceilings below still hold, so the surplus
  // flows DOWN the curve into mid-tier starters and bench stashes, like the real room does).
  const agg=Math.max(0.85,Math.min(2.2,(s.spotsLeft>0?s.budget/s.spotsLeft:1)/(leagueAvg||1)));
  let lean=Math.max(0.8,Math.min(1.2,td[pos]||1));
  if(raw>=25){if(pos==="QB"&&!td.eliteQB)lean=Math.min(lean,0.7);       // never paid up for a QB — won't start now
    if(pos==="TE"&&!td.payTE)lean=Math.min(lean,0.75);}
  // bench/depth money: the league's real $10-24 band is mostly these buys (2024-25: ~26-45 of
  // them per draft), so depth is shaded to 55% of curve with a cap that grows when flush —
  // squashing it to $2-9 hollowed the sim's middle class vs the actual bid history.
  let bid=raw*lean*agg*(starter?1:0.65)*mdJit(i,id)*fan;
  if(!starter)bid=Math.min(bid,Math.round(14*Math.max(1,agg)*fan));    // fans overpay even for their team's stashes
  // SPEND IT DOWN: nobody leaves money on the table. A flush team's bid is floored at its exact
  // surplus-clearing price — spots × (1 + surplus/spot) = budget — so late money dumps into the
  // best remaining players instead of $1 steals (the hard history ceilings below still apply).
  const perSur=s.spotsLeft>0?(s.budget-s.spotsLeft)/s.spotsLeft:0;
  if(perSur>2)bid=Math.max(bid,1+perSur);
  const HPc=(typeof KEEPERS_2026!=="undefined"&&KEEPERS_2026.bidcurve_pos)?KEEPERS_2026.bidcurve_pos[pos]:null;
  const posTop=HPc&&HPc.length?HPc[0]:66;                               // league's top $ at this position
  // RB/WR records get nudged (+8% — the league's raw maxes run above the smoothed curve top:
  // RB $68 in '25, WR $75 in '23); QB/TE ceilings are STICKY (raw recent maxes $32/$24 sit
  // BELOW the curve tops 34/28 — nobody's beating them, so no headroom)
  bid=Math.min(bid,Math.max(BENCH_CAP+2,(td.top||45)*1.05),posTop*((pos==="QB"||pos==="TE")?1:1.08));
  // floor $1: real demand (we passed the posDemand gate) always bids — deep bench RB/WR must
  // never round to $0 or the endgame force-feeds junk QBs/Ks to whoever nominates
  return Math.max(1,Math.min(Math.round(bid),afford));
}
function mdWhy(i,p,TS){const s=TS[i],td=ownerTend(i),pos=p.position,o=[];
  if(s.spotsLeft<=0)return "roster full";
  if(isK(p))return s.need[pos]>0?"needs the slot ($1 stream)":"streams later";
  const starter=(s.need[pos]>0)||(FLEXE.includes(pos)&&s.need.FLEX>0);
  o.push(s.need[pos]>0?"starter need":starter?"flex need":posDemand(s,pos,td)>0?"bench depth":"no need");
  if((td[pos]||1)>=1.2)o.push("loves "+pos);else if((td[pos]||1)<=0.7)o.push("light "+pos);
  if(pos==="QB"&&td.eliteQB&&(td.QB||1)>=1)o.push("pays QB"); if(pos==="TE"&&td.payTE)o.push("pays TE");
  if(ownerFan(i,p)>1)o.push("🏈 "+team26(p)+" fan (x"+ownerFan(i,p)+")");

// every owner's likely max for p (my row = my sheet's suggested max, not a bot)
function mdBids(p,mkt,TS,mv){const id=pid(p);
  return DR.teams.map((t,i)=>({i,name:t.name,me:i===DR.me,
    max:i===DR.me?(mv[id]?mv[id].maxBid:1):ownerBid(i,p,mkt,TS),
    why:i===DR.me?"your sheet — suggested max":mdWhy(i,p,TS)}))
    .sort((a,b)=>b.max-a.max||(b.me?1:0)-(a.me?1:0));}
function mdAdvance(){let g=DR.teams.length+1;do{MD.nom=(MD.nom+1)%DR.teams.length;}while(g-->0&&teamState(MD.nom).spotsLeft<=0);}
// who owner i brings to the block: the player he'd pay most for (his need + his lean)
function mdNominee(i,mkt,TS){
  const avail=PLAYERS.filter(p=>!DR.owned[pid(p)]);
  let best=null,bb=0;
  avail.forEach(p=>{const b=ownerBid(i,p,mkt,TS);
    if(b>bb||(b===bb&&b>0&&best&&raPts(p)>raPts(best))){bb=b;best=p;}});
  // fallback: the best priced RB/WR left (always useful as bench depth somewhere) — never an
  // unsellable junk QB/K the unsold rule would just cycle past
  const byP=arr=>arr.sort((a,b)=>(mkt.price[pid(b)]||0)-(mkt.price[pid(a)]||0))[0];
  return best||byP(avail.filter(p=>p.position==="RB"||p.position==="WR"))||byP(avail);}
// run the bidding: highest max wins (ties: you), pays runner-up +$1; nobody in -> nominator, $1
function mdResolve(id,myMax){
  const p=BYID[id]; if(!p||DR.owned[id])return;
  const mkt=dynamicMarket(),TS=DR.teams.map((_,t)=>teamState(t));
  // my bid is gated like everyone else's: no space -> out; capped so I can still fill my roster
  const meS=TS[DR.me],myEff=meS.spotsLeft>0?Math.min(Math.max(0,Math.round(+myMax||0)),Math.max(1,meS.budget-(meS.spotsLeft-1))):0;
  const bids=DR.teams.map((t,i)=>({i,max:i===DR.me?myEff:ownerBid(i,p,mkt,TS)}))
    .sort((a,b)=>b.max-a.max||((b.i===DR.me)?1:0)-((a.i===DR.me)?1:0));

    // a team with that starter slot open (never an 8-kicker bench); RB/WR depth fits anywhere.
    const useful=i=>TS[i].spotsLeft>0&&((isK(p)||p.position==="QB"||p.position==="TE")?TS[i].need[p.position]>0:true);
    const t=(TS[MD.nom]&&useful(MD.nom))?MD.nom:bids.map(b=>b.i).find(useful);
    if(t==null){MD.block=null;MD.sel=null;mdAdvance();saveMD();return;}   // unsold — next nomination
    w={i:t,max:1};second=0;}
  // PRICE ENFORCEMENT: the room never lets a flush team steal — when the winner has clearly more
  // money-per-spot than the field, rivals bid him up toward his max (they know he must spend it).
  const lAvg=mkt.spots>0?mkt.money/mkt.spots:1,ws=TS[w.i];
  const flushW=lAvg>0?(ws.spotsLeft>0?ws.budget/ws.spotsLeft:1)/lAvg:1;
  const enforce=flushW>1.1?Math.round(w.max*Math.min(0.97,0.6+0.18*flushW)):0;
  // endgame: relative flushness goes blind when the winner IS most of the remaining money
  // (everyone else broke -> flushW≈1) — a winner with absolute surplus pays at least his own
  // surplus-clearing price (spots × (1+surplus/spot) = budget), so the last wallet drains too
  const perSurW=ws.spotsLeft>0?(ws.budget-ws.spotsLeft)/ws.spotsLeft:0;
  const clearing=perSurW>2?Math.round(1+perSurW):0;
  const price=Math.max(1,Math.min(w.max,Math.max(second+1,enforce,clearing)));
  DR.owned[id]={t:w.i,price,kept:false};
  const ru=bids.find(b=>b.i!==w.i);
  MD.log.unshift({name:p.name,pos:p.position,t:w.i,price,ru:ru&&ru.max>0?ru.i:null,rmax:ru?ru.max:0,mine:w.i===DR.me});

  MD.block=null;MD.sel=null;mdAdvance();saveDR();saveMD();

// sim n picks (or to the end): bots nominate & bid, YOUR bot bids your sheet's suggested max
function mdSim(n){const target=n!=null?MD.log.length+n:Infinity;let g=cfg.teams*cfg.roster*20,dry=0;
  while(MD.log.length<target&&g-->0){
    const TS=DR.teams.map((_,t)=>teamState(t));
    if(TS.every(s=>s.spotsLeft<=0))break;
    if(TS[MD.nom].spotsLeft<=0){mdAdvance();continue;}
    const mkt=dynamicMarket(),mv=myVal(mkt);
    // MY nomination comes off MY target list (plan starters by priority, bench darts, Dart/Leap
    // pivots) — bots nominate what their own boards like
    const p=(MD.block&&BYID[MD.block]&&!DR.owned[MD.block])?BYID[MD.block]
      :(MD.nom===DR.me?(myTargetList(optimalPlan(mkt)).all.find(x=>!DR.owned[pid(x)])||mdNominee(MD.nom,mkt,TS))

    // 2nd TE once everyone else is full) — after 15 straight no-sales, hand off to the backstop
    dry=MD.log.length===before?dry+1:0;

  // open gets $1 fills from the best remaining USEFUL players — K/DST/QB/TE only into open
  // starter slots, everything else = best remaining RB/WR by benchU (the young-upside doctrine).
  if(n==null)DR.teams.forEach((_,i)=>{let s=teamState(i),guard2=cfg.roster+2;
    while(s.spotsLeft>0&&guard2-->0){
      const needPos=["K","DST","QB","TE"].find(pos=>s.need[pos]>0);
      const pool=PLAYERS.filter(p=>!DR.owned[pid(p)]&&(needPos?p.position===needPos:(p.position==="RB"||p.position==="WR")));
      const pick=pool.sort((a,b)=>(needPos?raPts(b)-raPts(a):benchU(b)-benchU(a)))[0];
      if(!pick)break;
      DR.owned[pid(pick)]={t:i,price:1,kept:false};
      MD.log.unshift({name:pick.name,pos:pick.position,t:i,price:1,ru:null,rmax:0,mine:i===DR.me});

// projected PPG per week — ONE canonical basis for every roster score: effPts (the same
// healthy-rate-lifted expectation the whole value engine prices from), /17. Using the raw
// games-penalized projection here while the knapsacks select on effPts made injury-lifted
// players (Rashee Rice) look like TERRIBLE keeps: seated at 7.6 ppg while valued at 11+.
// 🎚 WEEKLY GRADING, realized-scoring basis (calibration audit 2026-07-17,
// outputs/reports/team_ppg_calibration.md). Two fixes vs the old effPts/17:
//  1. STREAMING BACKFILL — a projected missed game scores replacement-level (you stream
//     the slot), not zero. Old way graded an optimally drafted MODEL-mode team at 112
//     PPG/wk — below the league's actual AVERAGE team (118.7 in 2025), impossible.
//  2. SCALE CALIBRATION — model proj_ppg is deliberately compressed for ranking; for
//     absolute team grades each position is rescaled to the FFA consensus starter-pool
//     scale (ex-ante, and empirically in line: FFA-mode optimal grades ~132 vs the real
//     top team's 136.7). Multipliers = FFA top-N/17 ÷ model backfilled top-N.
// Pure-FFA mode keeps the consensus points directly (already realized-scale). The VALUE
// and Exp $ engines (raPts/effPts) are untouched — this is the grading layer only.
const WK_CAL={QB:1.31,RB:1.12,WR:1.11,TE:1.13};
const replWk=pos=>((META.replacement_points||{})[pos]||0)/17;
const wkPts=p=>{

  const g=Math.max(1,Math.min(p.proj_games||ng,17));
  const hr=(typeof HEALTHY_PPG!=="undefined")?HEALTHY_PPG[p.name]:null;
  const base=PRJ(p)||p.proj_pts||0;                 // model total, or blend total (model scale)
  const ppg=hr||base/g;
  return (ppg*g+replWk(p.position)*(17-g))/17*(WK_CAL[p.position]||1)+bonus(p)*ng/17;

function teamPPGwk(i){const s=teamState(i),slots={QB:1,RB:2,WR:2,TE:1,FLEX:1,K:1,DST:1};let st=0,bn=0;

function lineupStarterPPG(players){
  const slots={QB:1,RB:2,WR:2,TE:1,FLEX:1,K:1,DST:1};let st=0;
  [...players].sort((a,b)=>wkPts(b)-wkPts(a)).forEach(p=>{const pos=p.position;
    if(slots[pos]>0){slots[pos]--;st+=wkPts(p);}
    else if(FLEXE.includes(pos)&&slots.FLEX>0){slots.FLEX--;st+=wkPts(p);}});
  return st;}
function _teamPPGgiven(mkt){                              // my owned + optimal completion, at current DR.owned
  const plan=optimalPlan(mkt);
  const own=teamState(DR.me).own.map(x=>x.p);
  return lineupStarterPPG(own.concat(plan.picks.map(pk=>pk.p)));}
let _sweepCache={};
function priceSweep(player,mkt){
  const id=pid(player),meS=teamState(DR.me);
  const key=id+"|"+meS.budget+"|"+meS.spotsLeft+"|"+Object.keys(DR.owned).length+"|"+projMode+"|"+BLEND_W;
  if(_sweepCache.k===key)return _sweepCache.v;
  const maxFeasible=Math.max(1,meS.budget-(meS.spotsLeft-1));   // must keep $1 for each OTHER open slot
  const E=Math.max(1,Math.min(Math.round(mkt.price[id]||1),maxFeasible));
  const saved=DR.owned[id];
  DR.owned[id]={t:(DR.me+1)%DR.teams.length,price:1,kept:false};   // baseline: he's gone to another team
  const base=_teamPPGgiven(mkt);
  // deep-discount anchor ($1 + ~60% of Exp), his Exp $, and the bidding-up region (+$5/+$10)
  const prices=[...new Set([1,Math.round(E*0.6),E,E+5,E+10]
    .map(x=>Math.max(1,Math.min(Math.round(x),maxFeasible))))].sort((a,b)=>a-b);
  const rows=prices.map(price=>{DR.owned[id]={t:DR.me,price,kept:false};
    return {price,ppg:_teamPPGgiven(mkt)};});
  if(saved===undefined)delete DR.owned[id];else DR.owned[id]=saved;
  // paying MORE for the same player leaves strictly less budget, so optimal team PPG is
  // provably non-increasing in price — clamp to the running min to erase λ-grid discretization
  // blips (a higher price must never appear to BUY a better team).
  for(let i=1;i<rows.length;i++)if(rows[i].ppg>rows[i-1].ppg)rows[i].ppg=rows[i-1].ppg;
  rows.forEach(r=>r.delta=r.ppg-base);
  let be=null;                                            // break-even by interpolation (delta is monotone ↓)
  for(let i=1;i<rows.length;i++)if(rows[i-1].delta>=0&&rows[i].delta<0){
    const t=rows[i-1].delta/(rows[i-1].delta-rows[i].delta);
    be=Math.round(rows[i-1].price+t*(rows[i].price-rows[i-1].price));break;}
  if(be===null)be=rows.every(r=>r.delta>=0)?maxFeasible:0;
  const v={base,rows,breakeven:be,E,maxFeasible};
  _sweepCache={k:key,v};return v;}

      return `<div style="text-align:center;padding:4px 10px;border-radius:8px;background:var(--panel2);${r.price===cur?'outline:1px solid var(--gold)':''}">
        <div class="muted" style="font-size:10px">$${r.price}${r.price===cur?' · exp':''}${r.price===sw.breakeven?' · walk-away':''}</div>

// Strategy (validated in outputs/reports/sentiment_props.md): when the forecast game-window
// (kickoff->+3h) sustained wind is 8-15 kn at an outdoor stadium, unders beat the closing
// market: totals 55-58%, QB pass-yds 59%+ (2015-25 OOS + forecast-conditioned 2024-25).
// 15+ kn is PRICED (no bet). Calm is no bet. Rain is watchlist-only (dead 2024-25).
const WIND_STAD={BAL:[39.2780,-76.6227],BUF:[42.7738,-78.7870],CAR:[35.2258,-80.8528],
  CHI:[41.8623,-87.6167],CIN:[39.0955,-84.5161],CLE:[41.5061,-81.6995],DEN:[39.7439,-105.0201],
  GB:[44.5013,-88.0622],JAX:[30.3239,-81.6373],KC:[39.0489,-94.4839],MIA:[25.9580,-80.2389],
  NE:[42.0909,-71.2643],NYG:[40.8128,-74.0742],NYJ:[40.8128,-74.0742],PHI:[39.9008,-75.1675],
  PIT:[40.4468,-80.0158],SF:[37.4032,-121.9698],SEA:[47.5952,-122.3316],TB:[27.9759,-82.5033],
  TEN:[36.1665,-86.7713],WAS:[38.9077,-76.8645]};
let WB=JSON.parse(localStorage.getItem("windbets_v1")||'null')||{bank0:500,bets:[],scan:null};
const saveWB=()=>localStorage.setItem("windbets_v1",JSON.stringify(WB));
const amToDec=a=>{a=+a;if(!a||Math.abs(a)<100)return null;return a<0?1+100/Math.abs(a):1+a/100;};
const wbKelly=(bank,dec,p)=>{const f=(p*dec-1)/(dec-1);return Math.max(0,Math.min(0.25*f,0.10))*bank;};
const wbPnl=b=>{const d=amToDec(b.price)||1.909;return b.result==="won"?b.stake*(d-1):b.result==="lost"?-b.stake:0;};
const wbBank=()=>WB.bank0+WB.bets.filter(b=>b.result).reduce((s,b)=>s+wbPnl(b),0);
function etToUTC(dateStr,timeStr){ // nflverse gametime is Eastern wall time
  const [hh,mm]=timeStr.split(":").map(Number);
  const [Y,M,D]=dateStr.split("-").map(Number);
  const want=Date.UTC(Y,M-1,D,hh,mm);
  let guess=new Date(want);
  for(let i=0;i<3;i++){
    const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",hour12:false,
      year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(guess);
    const g={};parts.forEach(x=>g[x.type]=x.value);
    const asET=Date.UTC(+g.year,+g.month-1,+g.day,g.hour==="24"?0:+g.hour,+g.minute);
    if(asET===want)break;
    guess=new Date(guess.getTime()+(want-asET));
  }
  return guess;
}
async function windScan(){
  const st=document.getElementById("wbScanStat");
  try{
    if(st)st.textContent="fetching schedule…";
    const r=await fetch("https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv");
    if(!r.ok)throw new Error("schedule HTTP "+r.status);
    const lines=(await r.text()).split("\n");
    const hd=lines[0].split(",");const ix={};hd.forEach((h,i)=>ix[h.trim()]=i);
    const seasonNow=(d=>d.getMonth()>=2?d.getFullYear():d.getFullYear()-1)(new Date());
    const now=Date.now(),rows=[];
    for(let i=1;i<lines.length;i++){
      const c=lines[i].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
      if(c.length<hd.length)continue;
      if(+c[ix.season]!==seasonNow)continue;
      const roof=(c[ix.roof]||"").trim();
      if(roof!=="outdoors"&&roof!=="open")continue;
      if((c[ix.location]||"").trim()!=="Home")continue;
      const home=c[ix.home_team].trim();
      if(!WIND_STAD[home])continue;
      const gt=(c[ix.gametime]||"").trim();
      if(!gt)continue;
      const ko=etToUTC(c[ix.gameday].trim(),gt),t=ko.getTime();
      if(t<now-4*36e5||t>now+8*864e5)continue;
      rows.push({gid:c[ix.game_id],week:c[ix.week],away:c[ix.away_team].trim(),home,ko:ko.toISOString()});
    }
    if(st)st.textContent=rows.length?`fetching forecasts for ${rows.length} games…`:"";
    const byStad={};rows.forEach(g=>{(byStad[g.home]=byStad[g.home]||[]).push(g);});
    for(const tm of Object.keys(byStad)){
      const [la,lo]=WIND_STAD[tm];
      const fr=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=wind_speed_10m,wind_gusts_10m,precipitation&windspeed_unit=kn&timezone=UTC&forecast_days=16`);
      if(!fr.ok)throw new Error("forecast HTTP "+fr.status);
      const H=(await fr.json()).hourly,tIdx={};H.time.forEach((s,i)=>tIdx[s]=i);
      byStad[tm].forEach(g=>{
        const k=new Date(g.ko);k.setUTCMinutes(0,0,0);
        const w=[],gu=[],pr=[];
        for(let h=0;h<=3;h++){
          const key=new Date(k.getTime()+h*36e5).toISOString().slice(0,13)+":00";
          const i=tIdx[key];
          if(i!==undefined&&H.wind_speed_10m[i]!=null){w.push(H.wind_speed_10m[i]);gu.push(H.wind_gusts_10m[i]);pr.push(H.precipitation[i]||0);}
        }
        if(!w.length){g.far=true;return;}
        g.wind=+(w.reduce((a,b)=>a+b,0)/w.length).toFixed(1);
        g.gust=Math.round(Math.max(...gu));
        g.rain=+pr.reduce((a,b)=>a+b,0).toFixed(1);
      });
    }
    WB.scan={ts:now,rows};saveWB();render();
  }catch(e){if(st)st.textContent="scan failed: "+e.message;}
}
function wbAddTickets(g){
  const bank=wbBank(),dec=1.909,date=g.ko.slice(0,10),game=`${g.away} @ ${g.home}`;
  const mk=(kind,desc,p)=>({id:Date.now()+Math.random().toString(16).slice(2,6),date,game,kind,desc,
    price:-110,stake:Math.max(1,Math.round(wbKelly(bank,dec,p))),result:null,
    fc:`${g.wind}kn g${g.gust}${g.rain>=1?" 🌧"+g.rain+"mm":""}`});
  WB.bets.push(mk("total","Game total UNDER ___",0.583),
               mk("prop",`${g.home} QB pass yds UNDER ___`,0.55),
               mk("prop",`${g.away} QB pass yds UNDER ___`,0.55));
  saveWB();render();
}

    ffc:"FantasyFootballCalculator crowd ADP — live 12-team PPR mock drafts (refresh: python scripts/fetch_ffc_adp.py)"};
  document.getElementById("hrow").innerHTML=COLS.map(c=>`<th class="${c[2]?'l':''}" data-k="${c[0]}"${HTIP[c[0]]?` title="${HTIP[c[0]]}" style="cursor:help"`:''}>${c[1]}</th>`).join("");
  document.querySelectorAll("#hrow th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(!k)return;
    if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==="name"||k==="team"||k==="position")?1:-1;}render();});
  const keptSet=new Set(Object.keys(kept));
  let rows=PLAYERS.filter(p=>{
    if(mode==="auction"&&keptSet.has(pid(p)))return false;
    if(posFilter==="FLEX"){if(!["RB","WR","TE"].includes(p.position))return false;}
    else if(posFilter==="ROOK"){if(p.is_rookie!==1)return false;}
    else if(posFilter!=="ALL"&&p.position!==posFilter)return false;
    if(startersOnly&&VP(p)<0)return false;
    if(draftableOnly&&(p.overall_rank>cfg.teams*cfg.roster||keptBy(p)))return false;   // keeper-locked = not draftable
    if(query&&!(p.name+" "+(p.team||"")).toLowerCase().includes(query))return false;
    return true;
  });
  rows.sort((a,b)=>{let x=gv(a,sortKey),y=gv(b,sortKey);
    if(typeof x==="string")return sortDir*x.localeCompare(y);return sortDir*(((x??-1e9))-((y??-1e9)));});
  // re-number overall rank by current effective VORP order for display
  const order=[...PLAYERS].sort((a,b)=>VP(b)-VP(a)); const ovr={}; order.forEach((p,i)=>ovr[pid(p)]=i+1);
  document.getElementById("count").textContent=rows.length+" players"+(ffaOn()?" · FFA":"");
  const f=v=>v===null||v===undefined?"—":v;
  document.getElementById("body").innerHTML=rows.map(p=>{
    const id=pid(p),t=Math.min(p.tier,5),base=BASE.vals[id]??0,bid=ADJ.vals[id]??0,u=upside(p);
    return "<tr>"+COLS.map(c=>{const k=c[0];
      if(k==="position")return `<td class="l"><span class="pos ${p.position}">${p.position}</span></td>`;
      if(k==="overall_rank")return `<td>${ovr[id]}</td>`;
      if(k==="pos_rank")return `<td>${projActive()?(p._prk??p.pos_rank):p.pos_rank}</td>`;
      if(k==="tier")return `<td><span class="tier t${t}">${p.tier}</span></td>`;
      if(k==="name"){let tg=stormTag(p)+(p.is_flex_starter?' <span class="flexstar">FLEX</span>':'');
        if(p.is_rookie===1)tg+=' <span class="tag rook">ROOK</span>';
        else if((p.breakout_prob||0)>=0.5)tg+=' <span class="tag brk">BREAK</span>';
        if(p.won_job===1)tg+=' <span class="tag won" title="Young (≤2 yr) player who ended 2025 entrenched after winning a role late — model runs slightly low (validated ~+0.7 PPG)">⬆ WON JOB</span>';
        if(p.vacated_role===1)tg+=` <span class="tag vac" title="Backfield lost its lead back (${p.vac_rb_carries||0} carries vacated, no real replacement) — returning RBs here beat projection ~+1.7 PPG (validated, both eras)">⬆ VACATED ROLE</span>`;
        if(p.age_risk===1)tg+=` <span class="tag agerisk" title="${ageRiskNote(p)}">⚠ AGE</span>`;
        tg+=rbAgeTag(p);
        tg+=keeperRiskTag(p);
        tg+=contractTag(p);
        if(p.conf==='low')tg+=' <span class="lowconf">stream</span>';
        if(p.archetype)tg+=` <span class="arch" title="Player archetype (from size/speed + usage)">${p.archetype}</span>`;
        return `<td class="l">${nameHTML(p.name,p.position,tg)}</td>`;}
      if(k==="team")return `<td class="l muted">${f(p.team)}</td>`;
      if(k==="proj")return `<td><b>${PRJ(p)==null?'—':Math.round(PRJ(p))}</b></td>`;
      if(k==="vorp")return `<td class="${VP(p)>=0?'upc':'downc'}" style="font-weight:600">${VP(p)==null?'—':Math.round(VP(p))}</td>`;
      if(k==="upside")return `<td class="${u&&u>=0.5?'upc':'muted'}">${u==null?'—':Math.round(u*100)+'%'}</td>`;
      if(k==="bust")return `<td class="${p.bust>=0.5?'downc':'muted'}" title="P(below-startable season)">${p.bust==null?'—':Math.round(p.bust*100)+'%'}</td>`;
      if(k==="boom")return `<td class="${p.boom>=0.4?'upc':'muted'}" style="font-weight:600" title="P(elite season)">${p.boom==null?'—':Math.round(p.boom*100)+'%'}</td>`;
      if(k==="ffa_adp")return `<td class="muted">${p._ffa&&p._ffa.adp?p._ffa.adp.toFixed(1):'—'}</td>`;
      if(k==="ffa_tier")return `<td class="muted">${p._ffa&&p._ffa.tier?p._ffa.tier:'—'}</td>`;
      if(k==="base")return `<td class="base">$${base}</td>`;
      if(k==="mexp"){const ko=keptBy(p);
        if(isK(p))return `<td class="base">—</td>`;
        if(ko)return `<td class="base"><span class="muted" style="cursor:help" title="KEEPER — locked by ${(DR.teams[ko.t]||{}).name||'?'} at $${ko.price} (🧩 Mock Keepers); not purchasable at auction">K</span></td>`;
        const g=mktGap(p);
        return `<td class="base">$${_AUC?(_AUC.exp[id]||1):1}${g?` <span style="cursor:help;font-size:10px" title="⚠ $${Math.abs(Math.round(g))} ${g>0?'ABOVE':'BELOW'} the external market mean (ESPN $${Math.round(espnAV(p))} / FFA AAV $${Math.round(auctionAAV(p))}). Why: ${mktGapWhy(p).replace(/"/g,'&quot;')}">⚠</span>`:''}</td>`;}
      if(k==="espn$"){const v=espnAV(p);return `<td class="muted">${v?'$'+Math.round(v):'—'}</td>`;}
      if(k==="aav"){const v=auctionAAV(p);return `<td class="muted">${v?'$'+Math.round(v):'—'}</td>`;}
      if(k==="mavg"){if(keptBy(p))return `<td class="muted">—</td>`;const v=mktAvg(p);return `<td style="font-weight:600">${v?'$'+Math.round(v):'—'}</td>`;}
      if(k==="mval")return `<td>${isK(p)?'—':'$'+(_AUC?(_AUC.rv[id]||1):1)}</td>`;
      if(k==="medge"){if(isK(p)||keptBy(p))return `<td class="muted">—</td>`;const v=Math.round((_AUC?(_AUC.rv[id]||1):1)-mktAvg(p));
        return `<td class="${v>0?'upc':(v<0?'downc':'muted')}" style="font-weight:600">${v>=0?'+':''}${v}</td>`;}
      if(k==="ffc")return `<td class="muted">${p.ffc_adp!=null?p.ffc_adp.toFixed(1):'—'}</td>`;
      if(k==="bid"){const up=bid>base;return `<td class="bid">$${bid}${up?` <span class="upc" style="font-weight:400;font-size:11px">+${bid-base}</span>`:''}</td>`;}
      if(k==="keep")return `<td class="l"><span class="keepbtn" data-id="${id}">＋</span></td>`;
      if(k==="actual_2025")return `<td class="muted">${f(p.actual_2025)}</td>`;
      return `<td>${f(p[k])}</td>`;
    }).join("")+"</tr>";
  }).join("");
  document.querySelectorAll(".keepbtn[data-id]").forEach(b=>b.onclick=()=>addKeeper(b.dataset.id));
  wireJump();
  if(mode==="auction")renderSide();
}

// ---------- keepers ----------
function addKeeper(id){if(kept[id]!==undefined)return;kept[id]=BASE.vals[id]??1;save();recompute();render();}
function renderSide(){
  const ids=Object.keys(kept);
  document.getElementById("kcount").textContent=`(${ids.length}/${cfg.teams*3} max)`;
  const infl=BASE.per>0?ADJ.per/BASE.per:1;
  document.getElementById("inflbox").innerHTML=
    `<div class="lbl muted" style="font-size:11px;text-transform:uppercase">Inflation on remaining pool</div>
     <div class="big ${infl>=1?'upc':'downc'}">×${infl.toFixed(2)} <span style="font-size:13px">(${infl>=1?'+':''}${Math.round((infl-1)*100)}%)</span></div>
     <div class="row"><span>$ spent on keepers</span><b>$${Math.round(ADJ.sumSal)}</b></div>
     <div class="row"><span>Skill $ left</span><b>$${Math.round(ADJ.skillMoney)}</b></div>
     <div class="row"><span>Skill spots left</span><b>${ADJ.skillSpotsRem}</b></div>
     <div class="row"><span>$ / VORP point</span><b>$${ADJ.per.toFixed(2)} <span class="muted">(base $${BASE.per.toFixed(2)})</span></b></div>`;
  if(!ids.length){document.getElementById("keeperlist").innerHTML='<div class="empty">No keepers set. Add with ＋ in the table.</div>';return;}
  const sorted=ids.map(id=>BYID[id]).filter(Boolean).sort((a,b)=>(BASE.vals[pid(b)]||0)-(BASE.vals[pid(a)]||0));
  document.getElementById("keeperlist").innerHTML=sorted.map(p=>{
    const id=pid(p),base=BASE.vals[id]||0,sal=+kept[id]||0,sur=base-sal;
    return `<div class="kp"><span class="pos ${p.position}" style="transform:scale(.85)">${p.position}</span>
      <span class="kn">${p.name}</span>$<input class="num ksal" data-id="${id}" type="number" value="${sal}" style="width:46px">
      <span class="sur ${sur>=0?'upc':'downc'}">${sur>=0?'+':''}${Math.round(sur)}</span><span class="x" data-id="${id}">✕</span></div>`;
  }).join("");
  document.querySelectorAll(".ksal").forEach(inp=>inp.onchange=()=>{kept[inp.dataset.id]=Math.max(0,+inp.value||0);save();recompute();render();});
  document.querySelectorAll(".kp .x").forEach(x=>x.onclick=()=>{delete kept[x.dataset.id];save();recompute();render();});
}

// ---------- init ----------
if(Object.keys(ffaMap).length){document.getElementById("srcFFA").disabled=false;document.getElementById("srcBlend").disabled=false;
  // "clear" only makes sense against an upload — the baked consensus has nothing to revert to.
  document.getElementById("ffaClear").style.display=ffaIsUpload()?"":"none";}
document.getElementById("srcModel").classList.toggle("active",projMode==="model");
document.getElementById("srcBlend").classList.toggle("active",projMode==="blend");
document.getElementById("srcFFA").classList.toggle("active",projMode==="ffa");
document.getElementById("blendWrap").style.display=projMode==="blend"?"":"none";
document.getElementById("ffaStatus").innerHTML=ffaStatusText();
cards();notes();recompute();render();
</script>
</body>
